name: Windows portable and installer
on:
  workflow_dispatch:
  push:
    branches: [ui/reference-layout]
    paths:
      - 'packaging/**'
      - 'groove_runtime.py'
      - '.github/workflows/windows-package.yml'
      - '*.py'
      - '*.pyw'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'LICENSE*'
permissions:
  contents: write
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SDL_AUDIODRIVER: dummy
      GROOVE_GOBLIN_TEST_AUDIO: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install pinned build dependencies
        timeout-minutes: 5
        run: python -m pip install -r packaging/requirements-build.txt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make curl tar diffutils
      - uses: actions/cache/restore@v4
        id: decoder-cache
        with:
          path: |
            build/ffmpeg
            build/sources
          key: windows-audio-decoder-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Compile bundled FFmpeg from checked source
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: msys2 {0}
        run: bash packaging/build_ffmpeg.sh
      - uses: actions/cache/save@v4
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/ffmpeg
            build/sources
          key: windows-audio-decoder-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Test all application workflows on Windows
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Fixture encoders require libraries deliberately absent in the shipped decoder.
          New-Item -ItemType Directory -Force build/test-tools | Out-Null
          python -c "import imageio_ffmpeg, shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), 'build/test-tools/ffmpeg.exe')"
          $env:PATH = "$pwd\build\test-tools;$env:PATH"
          python packaging/run_windows_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }
      # Regression fixtures use a full encoder build, but playback must also
      # pass with the deliberately smaller decoder shipped to users.
      - name: Test shipped audio decoder
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build\test-tools;$env:PATH"
          $env:IMAGEIO_FFMPEG_EXE = "$pwd\build\ffmpeg\ffmpeg.exe"
          python packaging/run_windows_tests.py test_formats.py
          if ($LASTEXITCODE -ne 0) { throw 'Bundled decoder regression failed' }
      - name: Build and launch frozen application
        timeout-minutes: 10
        run: python packaging/build_windows.py
      - name: Build installer
        timeout-minutes: 5
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install and launch with bundled runtime, then uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Groove Goblin installed'
          $setup = Start-Process dist/GrooveGoblin-1.6.1-Windows-x64-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Silent installation or runtime preflight failed' }
          if (Test-Path "$target\portable.flag") { throw 'Installed app accidentally entered portable mode' }
          $executables = @('Groove Goblin Desktop Mode.exe', 'Groove Goblin LITE Mode.exe', 'Groove Goblin Mobile Mode.exe', 'Launch Groove Goblin Suite.exe')
          foreach ($executable in $executables) {
            $report = Join-Path $env:RUNNER_TEMP ($executable + '-smoke.json')
            $app = Start-Process (Join-Path $target $executable) -ArgumentList "--self-test `"$report`"" -Wait -PassThru
            if ($app.ExitCode -ne 0 -or !(Test-Path $report)) { throw "Installed $executable did not launch" }
          }
          $uninstall = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Artifact checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*-Setup.exe,dist/*-Portable.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveGoblin-1.6.1-Windows-x64
          if-no-files-found: error
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/SHA256SUMS.txt
            build/frozen-*-smoke.json
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          if-no-files-found: ignore
          path: |
            build/test-results/**
            build/frozen-*-smoke.json
            build/ffmpeg/build-configuration.txt
      - name: Publish tested Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v1.6.1-windows-' + $env:GITHUB_SHA.Substring(0, 7)
          gh release create $tag dist/GrooveGoblin-1.6.1-Windows-x64-Setup.exe dist/GrooveGoblin-1.6.1-Windows-x64-Portable.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Groove Goblin 1.6.1 for Windows' --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifacts passed tests, but release upload failed' }
